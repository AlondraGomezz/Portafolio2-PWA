<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Ejercicio 2</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="contenedor-ejercicio" style="max-width: 800px;"> 
        <h2>Cámara Web</h2>
        <div style="display: flex; justify-content: space-around; align-items: center; gap: 20px; margin-bottom: 20px;">
            <div style="text-align: center;">
                <p style="margin-bottom: 10px;">Cámara</p>
                <video id="video" autoplay playsinline width="300" style="background: #000;"></video>
            </div>
            
            <div style="text-align: center;">
                <p style="margin-bottom: 10px;">Foto capturada</p>
                <img id="foto" alt="Foto capturada" style="display:none; width:300px; border-radius: 8px;">
                <div id="placeholderFoto" style="width:300px; height:225px; background:#e2e8f0; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#a0aec0;">Sin foto</div>
            </div>
        </div>

        <canvas id="canvas" width="300" height="225" style="display:none;"></canvas>
        
        <button id="btnCapturar" style="max-width: 300px; margin: 0 auto;">Tomar Foto</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const foto = document.getElementById('foto');

        // Iniciar cámara
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error("Error al acceder a la cámara: ", err); });

        // Capturar foto
        document.getElementById('btnCapturar').addEventListener('click', () => {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/png');
            foto.src = dataUrl;
            foto.style.display = 'block';
            canvas.style.display = 'none';
        });
        document.getElementById('placeholderFoto').style.display = 'none';
    </script>
</body>
</html>
